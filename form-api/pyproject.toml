[project]
name = "form-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "python-magic>=0.4.27",
    "python-multipart>=0.0.18",
    "pypdfium2>=4.30.0",
    "pillow>=11.0.0",
    "pyjwt (>=2.15.1,<3)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0"
pytest-asyncio = ">=0.24.0"
testcontainers = ">=4.9.0"
ruff = ">=0.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: needs a running Docker daemon"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"app/model/prompt.py" = ["E501"]
